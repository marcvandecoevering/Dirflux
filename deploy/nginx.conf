# Include inside nginx's http context. Replace host, certificates and upstream.
# Set COOKIE_SECURE=true in the application; keep its HTTP listener private.
server {
    listen 443 ssl;
    server_name files.example.com;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The application enforces MAX_UPLOAD_BYTES while receiving the stream.
    client_max_body_size 0;
    client_body_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8094;
        proxy_http_version 1.1;
        # Preserve the public port as well: Origin checks compare the full host.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 3600s;
    }
}
