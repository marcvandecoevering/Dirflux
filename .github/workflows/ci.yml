name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact revision to verify
        required: true
        type: string
      export_images:
        description: Retain the exact tested images as release candidate artifacts
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run test:package
      - name: Verify native systemd service
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/systemd-smoke.js
      - name: Verify HTTPS reverse proxy
        if: runner.os == 'Linux'
        run: node scripts/proxy-smoke.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-package-${{ matrix.os }}
          path: '*.tgz'
          if-no-files-found: error
  container:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: docker compose config --quiet
      - run: docker build --pull --build-arg SOURCE_REVISION="$(git rev-parse HEAD)" -t local/file-app-ci .
      - name: Test the built image with production dependencies
        run: >-
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=512m
          --tmpfs /cross-files:rw,noexec,nosuid,size=32m,mode=1777
          --tmpfs /cross-files/volume:rw,noexec,nosuid,size=32m,mode=1777
          -e FILE_APP_CROSS_VOLUME_TEST=1
          --mount "type=bind,src=${{ github.workspace }}/test,dst=/app/test,readonly"
          --mount "type=bind,src=${{ github.workspace }}/scripts,dst=/app/scripts,readonly"
          --entrypoint node local/file-app-ci --test
      - run: node scripts/container-smoke.js local/file-app-ci
      - name: Verify ZIP64 entry count above 65535
        run: >-
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=512m
          --mount "type=bind,src=${{ github.workspace }}/scripts,dst=/app/scripts,readonly"
          --entrypoint node local/file-app-ci scripts/many-entry-archive-smoke.js
      - name: Verify ZIP64 content above 4 GiB
        run: >-
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=128m
          --mount "type=bind,src=${{ github.workspace }}/scripts,dst=/app/scripts,readonly"
          --entrypoint node local/file-app-ci scripts/large-archive-smoke.js
      - name: Verify downloaded ZIP above 4 GiB
        if: matrix.os == 'ubuntu-24.04'
        run: |
          scratch="$(mktemp -d)"
          trap 'rmdir "$scratch"' EXIT
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$scratch,dst=/scratch" \
            --mount "type=bind,src=${{ github.workspace }}/scripts,dst=/app/scripts,readonly" \
            --entrypoint node local/file-app-ci scripts/large-output-archive-smoke.js /scratch
      - name: Export the tested image without rebuilding
        if: ${{ inputs.export_images }}
        run: node scripts/container-candidate.js local/file-app-ci "$RUNNER_TEMP/container-candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.export_images }}
        with:
          name: container-candidate-${{ matrix.os }}
          path: ${{ runner.temp }}/container-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
