name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact revision to verify
        required: true
        type: string
      export_images:
        description: Retain the exact tested images as release candidate artifacts
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Validate GitHub Actions definitions with pinned actionlint
        run: |
          set -euo pipefail
          directory="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXXXX")"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$directory/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' > "$directory/SHA256SUMS"
          (cd "$directory" && sha256sum --check SHA256SUMS)
          tar -xzf "$directory/actionlint.tar.gz" -C "$directory"
          "$directory/actionlint" -shellcheck= -pyflakes=
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run test:package
      - name: Verify native systemd service
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" scripts/systemd-smoke.js
      - name: Verify HTTPS reverse proxy
        if: runner.os == 'Linux'
        run: node scripts/proxy-smoke.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-package-${{ matrix.os }}
          path: '*.tgz'
          if-no-files-found: error
  container:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: docker compose config --quiet
      - run: docker build --pull --build-arg SOURCE_REVISION="$(git rev-parse HEAD)" -t local/file-app-ci .
      - name: Test the built image with production dependencies
        run: >-
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=512m
          --tmpfs /cross-files:rw,noexec,nosuid,size=32m,mode=1777
          --tmpfs /cross-files/volume:rw,noexec,nosuid,size=32m,mode=1777
          -e FILE_APP_CROSS_VOLUME_TEST=1
          --mount "type=bind,src=${{ github.workspace }}/test,dst=/app/test,readonly"
          --mount "type=bind,src=${{ github.workspace }}/scripts,dst=/app/scripts,readonly"
          --entrypoint node local/file-app-ci --test
      - run: node scripts/container-smoke.js local/file-app-ci
      - name: Verify fresh Unraid installation and beta.2 upgrade
        run: node scripts/unraid-install-smoke.js local/file-app-ci
      - name: Scan the built image for known OS and package vulnerabilities
        run: |
          docker image save local/file-app-ci --output "$RUNNER_TEMP/dirflux-image.tar"
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop=ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$RUNNER_TEMP,dst=/scan,readonly" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --cache-dir /tmp/trivy --scanners vuln --format json --input /scan/dirflux-image.tar \
            > "$RUNNER_TEMP/container-vulnerabilities.json"
          node scripts/check-vulnerabilities.js "$RUNNER_TEMP/container-vulnerabilities.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: container-vulnerabilities-${{ matrix.os }}
          path: ${{ runner.temp }}/container-vulnerabilities.json
          if-no-files-found: warn
      - name: Verify ZIP64 entry count above 65535
        run: >-
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=512m
          --mount "type=bind,src=${{ github.workspace }}/scripts,dst=/app/scripts,readonly"
          --entrypoint node local/file-app-ci scripts/many-entry-archive-smoke.js
      - name: Verify ZIP64 content above 4 GiB
        run: >-
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=128m
          --mount "type=bind,src=${{ github.workspace }}/scripts,dst=/app/scripts,readonly"
          --entrypoint node local/file-app-ci scripts/large-archive-smoke.js
      - name: Verify downloaded ZIP above 4 GiB
        if: matrix.os == 'ubuntu-24.04'
        run: |
          scratch="$(mktemp -d)"
          trap 'rmdir "$scratch"' EXIT
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$scratch,dst=/scratch" \
            --mount "type=bind,src=${{ github.workspace }}/scripts,dst=/app/scripts,readonly" \
            --entrypoint node local/file-app-ci scripts/large-output-archive-smoke.js /scratch
      - name: Export the tested image without rebuilding
        if: ${{ inputs.export_images }}
        run: node scripts/container-candidate.js local/file-app-ci "$RUNNER_TEMP/container-candidate"
      - name: Verify and reload the exported image
        if: ${{ inputs.export_images }}
        env:
          IMAGE_PLATFORM: ${{ matrix.os == 'ubuntu-24.04-arm' && 'linux/arm64' || 'linux/amd64' }}
        run: RELEASE_REVISION="$(git rev-parse HEAD)" node scripts/load-container-candidate.js "$RUNNER_TEMP/container-candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.export_images }}
        with:
          name: container-candidate-${{ matrix.os }}
          path: ${{ runner.temp }}/container-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
