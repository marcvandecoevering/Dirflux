name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-package-${{ matrix.os }}
          path: '*.tgz'
          if-no-files-found: error
  container:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: docker compose config --quiet
      - run: docker build --pull -t local/file-app-ci .
      - name: Test the built image with production dependencies
        run: >-
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=512m
          --mount "type=bind,src=${{ github.workspace }}/test,dst=/app/test,readonly"
          --mount "type=bind,src=${{ github.workspace }}/scripts,dst=/app/scripts,readonly"
          --entrypoint node local/file-app-ci --test
      - run: node scripts/container-smoke.js local/file-app-ci
      - name: Verify ZIP64 content above 4 GiB
        run: >-
          docker run --rm --read-only --cap-drop=ALL --security-opt no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,size=128m
          --mount "type=bind,src=${{ github.workspace }}/scripts,dst=/app/scripts,readonly"
          --entrypoint node local/file-app-ci scripts/large-archive-smoke.js
