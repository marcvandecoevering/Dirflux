name: Release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.1.0-beta.1
        required: true
        type: string
      create_draft:
        description: Create a GitHub draft prerelease after verification (does not publish)
        required: false
        default: false
        type: boolean
      publish_images:
        description: Publish the exact verified AMD64 and ARM64 images to GHCR
        required: false
        default: false
        type: boolean
      update_beta:
        description: Advance the beta update channel after verified image publication
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: dirflux-image-publication
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - id: source
        name: Require a matching existing version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const tag=process.env.RELEASE_TAG;
          const manifest=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)||tag!=='v'+manifest.version)throw new Error('Tag/version mismatch');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const revision=git('rev-parse','HEAD');
          if(git('rev-parse',`refs/tags/${tag}^{commit}`)!==revision)throw new Error('Not the requested tag');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`revision=${revision}\n`);
          NODE
  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.revision }}
      export_images: true
  package:
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
      - name: Assemble checksummed candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm run candidate -- "$RUNNER_TEMP/release-candidate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ inputs.tag }}
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
          retention-days: 30
  publish-images:
    if: ${{ inputs.publish_images }}
    needs: [resolve, verify, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Publish verified container artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          PUBLISH_BETA: ${{ inputs.update_beta }}
        run: node scripts/publish-images.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-images-${{ inputs.tag }}
          path: published-images.json
          if-no-files-found: error
  draft:
    if: ${{ inputs.create_draft }}
    needs: [resolve, verify, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Download this run's candidate and verify before creating a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          directory="$(mktemp -d "$RUNNER_TEMP/draft-release.XXXXXXXX")"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-candidate-$RELEASE_TAG" --dir "$directory"
          node scripts/verify-candidate.js "$directory"
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '[.object.type,.object.sha] | @tsv')"
          read -r kind revision <<< "$object"
          for depth in {1..16}; do
            if [ "$kind" = commit ]; then break; fi
            test "$kind" = tag
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$revision" --jq '[.object.type,.object.sha] | @tsv')"
            read -r kind revision <<< "$object"
          done
          test "$kind" = commit
          test "$revision" = "$RELEASE_REVISION"
          gh release create "$RELEASE_TAG" "$directory"/*.tgz "$directory/SHA256SUMS" "$directory/release.json" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_REVISION" \
            --draft --prerelease --title "$RELEASE_TAG" --generate-notes
