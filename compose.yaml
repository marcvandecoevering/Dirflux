services:
  dirflux:
    build: .
    container_name: dirflux
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      HOST: 0.0.0.0
      PORT: 8094
      FILES_DIR: /files
      CONFIG_DIR: /config
      MAX_UPLOAD_BYTES: 10737418240
      READ_ONLY: "false"
      COOKIE_SECURE: "false"
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - droppy-files:/files
      - droppy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
volumes:
  droppy-files:
  droppy-config:
